name: Update All Timeline Plots

on:
  workflow_run:
    workflows:
      - "Update ADS Citation Metrics"
      - "Update ADS Publications List"
    types:
      - completed
  workflow_dispatch:

jobs:
  update-plots:
    # Only run if triggering workflow succeeded
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Pull latest changes
        run: |
          git fetch origin
          git pull origin main --ff-only

      - name: Derive citations by year from ADS metrics
        run: python scripts/derive_citations_by_year.py

      - name: Generate citations timeline plot
        run: python scripts/generate_citations_timeline.py

      - name: Generate publications timeline plot
        run: python scripts/generate_publications_timeline.py

      - name: Generate h-index timeline plot
        run: python scripts/generate_h_index_timeline.py

      - name: Commit updated plots
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/data/publications_timeline.json public/data/citations_by_year.json public/plots/*.svg public/plots/*.png
          git commit -m "Update timeline plots [automated]" || echo "No changes to commit"
          git push origin main

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Workflow failed: ${context.workflow} (run ${context.runId})`,
              body: [
                `**Workflow:** ${context.workflow}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Triggered by:** ${context.eventName}`,
                `**SHA:** ${context.sha}`,
                ``,
                `Auto-created by \`if: failure()\`. Investigate run logs at the URL above.`
              ].join('\n'),
              labels: ['workflow-failure', 'automated']
            })
