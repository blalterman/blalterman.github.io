# Spent-When: PERMANENT(the workflow is retired or replaced by a later merge)
# Supersedes: none
name: Update Site Data

on:
  schedule:
    - cron: "23 1 * * 1"  # Every Monday at 01:23 UTC
  workflow_dispatch:

jobs:
  update-site-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.10'

      - name: Cache pip dependencies
        uses: actions/cache@v5
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r scripts/requirements.txt

      - name: Fetch ADS citation metrics
        env:
          ADS_DEV_KEY: ${{ secrets.ADS_DEV_KEY }}
          ADS_ORCID: ${{ secrets.ADS_ORCID }}
        run: |
          python scripts/fetch_ads_metrics_to_data_dir.py --orcid $ADS_ORCID

      # Cheap insurance between the two ADS calls, not a load-bearing quota
      # workaround (ADS's documented limit is 5000 req/day; a full refresh
      # makes three calls). The May/June 2026 failures were bot-protection
      # edge blocking, which the longer retry in scripts/utils.py addresses;
      # this sleep just avoids hitting both calls back to back for free.
      - name: Pause between ADS calls
        run: sleep 60

      - name: Fetch ADS publications
        env:
          ADS_DEV_KEY: ${{ secrets.ADS_DEV_KEY }}
          ADS_ORCID: ${{ secrets.ADS_ORCID }}
        run: |
          python scripts/fetch_ads_publications_to_data_dir.py

      - name: Merge invited conferences
        run: |
          python scripts/merge_invited_conferences.py

      - name: Generate integrated publication statistics
        run: |
          python scripts/generate_publication_statistics.py

      # derive_citations_by_year.py reads ads_metrics.json, so it must run
      # after the metrics fetch above (formerly enforced by workflow_run
      # ordering between separate workflows; now enforced by step order in
      # this single job).
      - name: Derive citations by year from ADS metrics
        run: python scripts/derive_citations_by_year.py

      - name: Generate citations timeline plot
        run: python scripts/generate_citations_timeline.py

      - name: Generate publications timeline plot
        run: python scripts/generate_publications_timeline.py

      - name: Generate h-index timeline plot
        run: python scripts/generate_h_index_timeline.py

      - name: Commit and push updated data and plots
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add public/data/ads_metrics.json
          git add public/data/ads_publications.json
          git add public/data/non_ads_publications.json
          git add public/data/publication_statistics.json
          git add public/data/publications_timeline.json
          git add public/data/citations_by_year.json
          git add public/plots/
          git diff --cached --quiet && { echo "No changes"; exit 0; }
          git commit -m "Update site data [automated]"
          for i in 1 2 3 4 5; do
            git push origin main && exit 0
            git fetch origin && git rebase origin/main || { git rebase --abort || true; }
            sleep $((5 * i))
          done
          echo "push failed after 5 attempts"; exit 1

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@v9
        with:
          script: |
            const title = `Workflow failed: ${context.workflow} (run ${context.runId})`;
            const { data: existing } = await github.rest.issues.listForRepo({
              owner: context.repo.owner,
              repo: context.repo.repo,
              state: 'open',
              labels: 'workflow-failure',
            });
            if (existing.some(issue => issue.title === title)) {
              console.log('Matching open issue already exists, skipping.');
              return;
            }
            github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body: [
                `**Workflow:** ${context.workflow}`,
                `**Run:** ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
                `**Triggered by:** ${context.eventName}`,
                `**SHA:** ${context.sha}`,
                ``,
                `Auto-created by \`if: failure()\`. Investigate run logs at the URL above.`
              ].join('\n'),
              labels: ['workflow-failure', 'automated']
            })
